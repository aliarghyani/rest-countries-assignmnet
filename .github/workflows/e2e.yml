name: E2E

on:
  # Run E2E only for PRs targeting main (and manual runs)
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        # Use version from package.json `packageManager`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm e2e:install

      - name: Run Playwright tests
        env:
          CI: '1'
        run: pnpm e2e

      - name: Upload Playwright report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
